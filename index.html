  <style>
    :root {
      --accent: #536df2;
      --accent-deep: #465edf;
      --accent-pale: #e8ebff;
      --ink: #23263b;
      --muted: #858ba4;
      --line: #e9ebf6;
      --page: #fafbff;
      --card: #f2f3ff;
      /* Priority matrix palette: background and border can be adjusted independently. */
      --priority-red-bg: #FFF1F1;
      --priority-red-border: #F4D7D7;
      --priority-yellow-bg: #FFFBEA;
      --priority-yellow-border: #F2E8BF;
      --priority-green-bg: #EFF9F2;
      --priority-green-border: #D7EBDD;
      --priority-neutral-bg: #F5F6F8;
      --priority-neutral-border: #E4E6EB;
      --white: #fff;
      --shadow: 0 16px 36px rgba(67,75,139,.07), 0 3px 10px rgba(60,66,110,.035);
      font-family: Pretendard Variable, Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    html { min-width: 300px; background: var(--page); }
    body { margin: 0; background: var(--page); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #a8b4ff; outline-offset: 3px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .app { width: 100%; min-height: 100svh; max-width: 520px; padding: 29px 22px 38px; margin: 0 auto; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); user-select: none; }
    .brand-symbol svg { width: 21px; height: 21px; }
    .list-icon svg { width: 19px; height: 19px; }
    .chevron svg { width: 20px; height: 20px; }
    .completed-icon svg { width: 17px; height: 17px; }
    .empty-icon svg { width: 28px; height: 28px; }
    .brand-symbol { height: 34px; width: 34px; border-radius: 12px; background: #e8ebff; display: grid; place-items: center; color: var(--accent); }
    .brand-name { font-size: 27px; font-weight: 850; letter-spacing: -.085em; line-height: 1; }
    .brand-dot { color: var(--accent); margin-left: 1px; }
    .icon-btn { width: 44px; height: 44px; flex: 0 0 44px; border: 0; border-radius: 15px; background: #f0f2fb; display: grid; place-items: center; color: #464c6a; transition: background .15s; }
    .icon-btn:hover { background: #e6eafa; }
    .icon-btn svg { display: block; width: 22px; height: 22px; overflow: visible; transform:none; }
    .week-chip { display: inline-flex; align-items: center; gap: 9px; color: #333e78; font-size: 14px; font-weight: 740; background: #ebedff; padding: 10px 15px; border-radius: 999px; margin-top: 31px; }
    .week-chip svg { width: 17px; height: 17px; }
    .week-date { color: #a0a4b5; font-size: 12px; font-weight: 520; margin-left: 5px; }
    .intro { margin: 52px 0 0; }
    .intro-line { display: block; margin: 0; font-size: clamp(17px, 4.7vw, 22px); font-weight: 760; line-height: 1.43; letter-spacing: -.055em; white-space: normal; }
    .intro-emphasis { display: block; margin: 6px 0 0; font-size: clamp(29px, 8.15vw, 39px); font-weight: 850; letter-spacing: -.065em; line-height: 1.25; color: var(--accent); }
    .focus-stage { position: relative; margin-top: 91px; }
    .focus-card { position: relative; padding: 28px 26px 23px; border-radius: 31px; background: var(--card); box-shadow: var(--shadow); border: 1px solid #eef0fc; }
    .mascot { position: absolute; z-index: 1; top: -79px; right: 13px; width: 130px; height: 99px; pointer-events: none; }
    .eyebrow { display: inline-flex; align-items: center; gap: 5px; padding: 8px 13px; border-radius: 999px; color: var(--accent); background: #e3e7ff; font-size: 13px; font-weight: 780; }
    .task-heading { margin: 23px 0 0; font-size: clamp(23px, 6.4vw, 30px); font-weight: 820; line-height: 1.34; letter-spacing: -.064em; overflow-wrap: anywhere; }
    .task-parent { font-size: 14px; color: var(--muted); margin: 12px 0 28px; line-height: 1.5; overflow-wrap: anywhere; }
    .primary-btn { width: 100%; border: 0; border-radius: 17px; padding: 16px 17px; min-height: 54px; color: white; background: var(--accent); font-size: 16px; font-weight: 750; box-shadow: 0 6px 12px rgba(83,109,242,.1); transition: transform .13s, background .13s; }
    .primary-btn:hover { background: var(--accent-deep); }
    .primary-btn:active { transform: scale(.987); }
    .complete-count { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 19px; font-size: 13px; color: #8288a1; font-weight: 660; }
    .count-pill { color: var(--accent); background: #e4e8ff; padding: 4px 9px; border-radius: 999px; font-weight: 800; }
    /* Home navigation: two independent cards with equal dimensions. */
    .home-links { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 22px; }
    .home-link { min-width: 0; min-height: 104px; border: 1px solid #eef0f9; border-radius: 22px; background: #fff; color: #2f344d; box-shadow: var(--shadow); padding: 15px 13px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; gap: 13px; }
    .home-link:hover { border-color: #cbd4ff; background: #fcfcff; }
    .home-link:active { transform: scale(.99); }
    .home-link-top { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 5px; }
    .home-link-icon { flex: none; width: 36px; height: 36px; border-radius: 11px; background: #eaedff; color: var(--accent); display: grid; place-items: center; }
    .home-link-icon svg { display: block; width: 19px; height: 19px; }
    .home-link-arrow { color: #a3a8ba; display: grid; place-items: center; }
    .home-link-arrow svg { width: 18px; height: 18px; }
    .home-link-label { display: block; font-size: 14px; font-weight: 760; line-height: 1.35; overflow-wrap: keep-all; word-break: keep-all; }
    /* Matrix is an honest read-only shell until classification and detail editing ship. */
    .matrix-view { margin-top: 36px; }
    .matrix-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .matrix-cell { min-height: 150px; border: 1px solid #e9ebf6; border-radius: 19px; padding: 13px 11px; }
    .matrix-cell h2 { margin: 0 0 7px; font-size: 13px; font-weight: 820; line-height: 1.4; }
    .matrix-cell p { margin: 0; color: #8b91a4; font-size: 11px; line-height: 1.4; }
    .matrix-cell .parent-card { background: white; border-radius: 9px; padding: 8px 9px; font-size: 12px; margin-top: 9px; font-weight: 660; overflow-wrap: anywhere; }
    .matrix-red { background: var(--priority-red-bg); border-color: var(--priority-red-border); }
    .matrix-orange { background: var(--priority-yellow-bg); border-color: var(--priority-yellow-border); }
    .matrix-green { background: var(--priority-green-bg); border-color: var(--priority-green-border); }
    .matrix-purple { background: var(--priority-neutral-bg); border-color: var(--priority-neutral-border); }
    .first-label { display: inline-flex!important; margin-top: 5px!important; border-radius: 999px; color: #536df2!important; background: #e4e8ff; padding: 3px 7px; font-size: 10px!important; font-weight: 780; width: fit-content; }
    @media(max-width:350px){ .home-links { grid-template-columns: 1fr; } .home-link { min-height: 72px; flex-direction: row; align-items: center; } .home-link-top { width: auto; } .home-link-label { flex: 1; } .home-link-arrow { display: none; } }
    .full-list-btn { width: 100%; margin-top: 22px; min-height: 70px; border: 1px solid #f1f2fa; background: #fff; color: #2f344d; box-shadow: var(--shadow); border-radius: 24px; padding: 18px 21px; display: flex; align-items: center; gap: 14px; text-align: left; font-size: 16px; font-weight: 740; }
    .full-list-btn:hover { border-color: #d8ddff; }
    .full-list-btn .list-icon { flex: none; width: 39px; height: 39px; border-radius: 13px; display: grid; place-items: center; color: var(--accent); background: #eaedff; }
    .full-list-btn .chevron { margin-left: auto; color: #8990a9; width: 20px; }
    .tiny-note { text-align: center; font-size: 11px; line-height: 1.5; color: #989eb1; margin-top: 22px; }
    .empty-stage .focus-card { text-align: center; }
    .empty-stage .task-heading { margin-top: 21px; }
    .empty-stage .task-parent { margin-bottom: 26px; }
    .empty-icon { width: 48px; height: 48px; display: grid; place-items: center; margin: 6px auto 10px; border-radius: 17px; color: var(--accent); background: #e2e6ff; }
    .empty-icon svg { width: 28px; }
    .all-view { margin-top: 36px; }
    .screen-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
    .back-btn { background: #eff0fa; width: 39px; height: 39px; border: none; border-radius: 13px; display: grid; place-items: center; color: #45496e; }
    .back-btn svg { width: 20px; }
    .screen-title { font-size: 24px; font-weight: 830; margin: 0; letter-spacing: -.055em; }
    .screen-desc { color: #8b91a6; margin: 0 0 22px; font-size: 14px; line-height: 1.65; }
    .summary-row { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 21px; background: #f0f1ff; border: 1px solid #eaecfa; padding: 18px 8px; margin: 19px 0 24px; }
    .summary-unit { display: flex; flex-direction: column; gap: 7px; align-items: center; padding: 0 6px; }
    .summary-unit + .summary-unit { border-left: 1px solid #dfe3f4; }
    .summary-unit span { color: #7a8098; font-size: 12px; white-space: nowrap; }
    .summary-unit strong { color: #2e3559; font-weight: 840; font-size: 23px; }
    .list-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 12px; }
    .section-title { margin: 0; font-size: 17px; letter-spacing: -.04em; font-weight: 800; }
    .helper { font-size: 12px; color: #979cad; }
    .task-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 16px; }
    .task-row { border: 1px solid #ebedf6; border-radius: 17px; background: #fff; display: flex; align-items: center; min-height: 78px; gap: 12px; padding: 12px 11px 12px 14px; box-shadow: 0 3px 9px rgba(30,40,85,.035); }
    .task-row.is-first { background: #f2f3ff; border-color: #cdd5ff; }
    .task-row.is-dragging { opacity: .27; border-style: dashed; }
    .task-rank { flex: none; color: #777f9d; font-size: 13px; font-weight: 800; background: #f0f1fa; border-radius: 10px; height: 30px; width: 30px; display: grid; place-items: center; }
    .is-first .task-rank { background: #dfe5ff; color: var(--accent); }
    .row-copy { min-width: 0; flex: 1; }
    .row-copy strong { font-size: 14px; font-weight: 740; display: block; line-height: 1.4; overflow-wrap: anywhere; }
    .row-copy span { display: block; color: #979caf; font-size: 12px; line-height: 1.4; margin-top: 3px; overflow-wrap: anywhere; }
    .drag-handle { display: grid; place-items: center; flex: none; width: 39px; height: 44px; border: none; background: transparent; color: #a0a6bc; touch-action: none; cursor: grab; border-radius: 10px; }
    .drag-handle:active { cursor: grabbing; }
    .drag-handle:hover { background: #eff1fa; color: #606d9d; }
    .drag-handle svg { width: 22px; height: 22px; }
    .task-drag-ghost { position: fixed; margin: 0; z-index: 9999; pointer-events: none; opacity: .97; box-shadow: 0 16px 35px rgba(63,79,177,.22); border: 1px solid #aab7ff; transform: rotate(-1deg); }
    .add-btn { width: 100%; min-height: 49px; background: #ecedff; border: 0; border-radius: 16px; font-size: 14px; font-weight: 740; color: #536bea; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .add-btn:hover { background: #e1e5ff; }
    .section-spacer { margin-top: 30px; }
    .completed-list { display: flex; flex-direction: column; gap: 8px; margin-top: 13px; }
    .completed-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 13px; background: #fff; border: 1px solid #f0f0f6; border-radius: 14px; }
    .completed-icon { flex: none; color: #8e98e6; margin-top: 2px; width: 17px; height: 17px; }
    .completed-copy { min-width: 0; }
    .completed-copy strong { display: block; font-size: 13px; color: #8a91a4; font-weight: 630; text-decoration: line-through; line-height: 1.45; }
    .completed-copy span { font-size: 11px; color: #a2a7b6; display: block; margin-top: 2px; }
    .muted-box { background: #f5f6fc; border-radius: 17px; padding: 22px 17px; text-align: center; font-size: 13px; color: #858b9f; line-height: 1.65; }
    .past-history { margin-top: 13px; }
    details { font-size: 13px; color: #747b99; }

  function topNav(title){return `${header()}<div class="screen-heading screen-heading-v3"><button type="button" data-action="home" class="back-btn" aria-label="홈으로 돌아가기">${I.back}</button><h1 class="screen-title">${esc(title)}</h1></div>`;}
  function weekSwitch(){return `<div class="week-tools"><div class="week-selector"><button type="button" class="week-arr" data-action="prev-week" aria-label="이전 주">${I.back}</button><div class="week-info"><div>${esc(fmtWeek(selectedWeek))}</div><small>${esc(fmtRange(selectedWeek))}</small></div><button type="button" class="week-arr" data-action="next-week" aria-label="다음 주">${I.forward}</button></div>${selectedWeek!==actualWeek()?'<button type="button" class="today-link" data-action="current-week">이번 주로</button>':''}</div>`;}
  function home(){
    const mode=weekMode(),actions=weeklyActions(selectedWeek),a=actions[0];
    const weekTasks=mode==='past'?(state.history[selectedWeek]?.tasks||[]):state.tasks.filter(t=>taskInWeek(t,selectedWeek));
    const count=weekTasks.filter(t=>t.status==='done').length;
    const pending=weekTasks.some(t=>t.status==='todo');
    const allDone=!a&&weekTasks.length>0&&!pending&&weekTasks.some(t=>t.status==='done');
    const needsAction=!a&&mode==='now'&&weekTasks.some(t=>t.status==='todo'&&needsNext(t));
    let introTitle,introDesc;
    if(allDone){introTitle=mode==='past'?'지난 주도 수고했어요!':'이번 주도 수고했어요!';introDesc='계획한 할 일을 모두 마쳤어요.';}
    else if(a){introTitle='뭐부터 할지 고민할 필요 없어요.';introDesc='지금은 이것부터!';}
    else if(mode==='future'){introTitle='다가올 주를 미리 준비해 볼까요?';introDesc='하나씩 정리하면 충분해요.';}
    else if(mode==='past'){introTitle='지난 주의 기록을 확인해 보세요.';introDesc='작은 실행의 흔적을 돌아볼 시간이에요.';}
    else{introTitle='이번 주, 무엇부터 시작할까요?';introDesc='하나씩 정리하면 충분해요.';}
    const intro='<div class="intro '+(a?'intro-working':'intro-calm')+'"><h1 class="intro-line">'+esc(introTitle)+'</h1>'+(a?'<strong class="intro-emphasis">'+esc(introDesc)+'</strong>':'<p class="intro-sub">'+esc(introDesc)+'</p>')+'</div>';
    const label=mode==='past'?'지난 주 기록':mode==='future'?'예정된 할 일':'지금 할 일';
    let title,description,cta,buttonAction='';
    if(a){
      title=a.title;
      description=mode==='past'?(a.parentLabel||''):(a.kind==='next-action'?getTask(a.taskId)?.title||a.parentLabel||'':'');
      cta=mode==='now'?'다 했어요':mode==='future'?'시작 예정':'지난 주 조회';
      buttonAction=mode==='now'?' data-action="complete"':' disabled';
    }else if(allDone){
      title=mode==='past'?'지난 주 할 일을 모두 마쳤어요!':'이번 주 할 일, 전부 끝! 🎉';
      description='이번 주도 하나씩 해냈어요.';
      cta=mode==='past'?'이번 주로 돌아가기':'새 할 일 추가하기';
      buttonAction=' data-action="'+(mode==='past'?'current-week':'open-matrix')+'"';
    }else if(mode==='past'){
      title='이 주의 실행 기록이 없어요.';
      description='지난주 기록은 해당 주가 지나면 보관돼요.';
      cta='이번 주로 돌아가기';
      buttonAction=' data-action="current-week"';
    }else if(mode==='future'){
      title='아직 등록된 할 일이 없어요';
      description='이 주에 할 일을 미리 등록할 수 있어요.';
      cta='할 일 추가하기';
      buttonAction=' data-action="open-matrix"';
    }else if(needsAction){
      title='다음 행동을 정해볼까요?';
      description='한 번에 하기 막막하다면, 할 일을 작은 단계로 나눠 보세요.';
      cta='할 일 쪼개기';
      buttonAction=' data-action="open-matrix"';
    }else{
      title='아직 등록된 할 일이 없어요';
      description='할 일을 정리하면 가장 먼저 할 일이 여기에 나타나요.';
      cta='할 일 추가하기';
      buttonAction=' data-action="open-matrix"';

  function validateTaskForm(form){

    const urgency=quadrant?quadrant.urgent:urg?urg.value==='true':null;
    if(!title){error('할 일 이름을 입력해 주세요.');return null;}
    if(title.length>120){error('할 일 이름은 120자 이내로 입력해 주세요.');return null;}

  }
  function taskSubmit(form){

      actionChildren(old).filter(a=>a.kind==='standalone'&&a.status==='todo').forEach(a=>{a.title=v.title;a.updatedAt=new Date().toISOString();});

  function addInlineStep(taskId,title){

    const direct=actionChildren(t).find(a=>a.kind==='standalone'&&a.status==='todo');
    const pos=first&&Number.isFinite(direct?.order)?direct.order:null;

  function selectTasks(form){

  function stepSubmit(form){
    const title=form.elements.title.value.trim();if(!title){error('실행 단계 이름을 입력해 주세요.');return;}if(title.length>120){error('실행 단계 이름은 120자 이내로 입력해 주세요.');return;}

       if(t.status==='done')clearParentCompletion(t);

      const direct=actionChildren(t).find(a=>a.kind==='standalone'&&a.status==='todo');

  function reconcileStages(t){
    if(!t)return;
    const stages=children(t).filter(a=>a.status!=='cancelled');
    if(stages.length){
      const allDone=stages.every(a=>a.status==='done');
      if(allDone&&t.status!=='done'){
        const stamp=new Date().toISOString();t.status='done';t.completedAt=stamp;t.completedWeek=actualWeek();t.completionMode='auto';
      }else if(!allDone&&t.status==='done'&&t.completionMode==='auto')clearParentCompletion(t);
      return;
    }
    if(t.status==='done'&&t.completionMode==='auto')clearParentCompletion(t);
    t.hasEverHadSteps=false;
    let direct=actionChildren(t).find(a=>a.kind==='standalone'&&a.status==='cancelled'&&a.cancelledBySplit);
    if(direct){direct.status='todo';direct.cancelledBySplit=false;direct.title=t.title;direct.completedAt=null;direct.completedWeek=null;}
    else if(t.status==='todo'&&!actionChildren(t).some(a=>a.kind==='standalone'&&a.status==='todo')){
      direct=newAction(t,t.title,'standalone');state.actions.push(direct);
    }
    if(direct&&t.status==='todo'&&eligibleTask(t)&&!Number.isFinite(direct.order))direct.order=nextOrder();
  }

  function completeParent(id){

  function reopenParent(id){
    const t=getTask(id);if(!t||t.status!=='done')return;

    if(!d.started)return;
    if(commit){d.placeholder.replaceWith(d.source);}
    else{d.placeholder.remove();d.firstParent.insertBefore(d.source,d.firstNext?.parentElement===d.firstParent?d.firstNext:null);}
  }
  function dragEnd(e){
    if(!drag||e.pointerId!==drag.pointerId)return;
    const d=drag;drag=null;
    if(!d.started)return;
    dragCleanup(d,true);
    const list=d.source.parentElement;
    const ids=[...list.children].filter(el=>el.classList.contains('sortable-item')).map(el=>el.dataset.id);
    if(d.mode==='matrix'){
      const zone=d.source.closest('.matrix-cell');
      const q=Q[Number(zone?.dataset.quadrant)],t=getTask(d.source.dataset.id);
      if(q&&t){t.importance=q.important;t.urgency=q.urgent;t.updatedAt=new Date().toISOString();}
      [...document.querySelectorAll('.matrix-task')].forEach((el,i)=>{const t=getTask(el.dataset.id);if(t)t.parentDisplayOrder=i;});
    }else if(d.mode==='queue'){
      const all=activeActions();const byId=new Map(all.map(a=>[a.id,a]));
      ids.forEach((id,i)=>{const a=byId.get(id);if(a)a.order=i;});
    }else if(d.mode==='matrix-children'||d.mode==='children'){
      const pid=list.dataset.parentId;
      ids.forEach((id,i)=>{const a=state.actions.find(x=>x.id===id);if(a&&a.taskId===pid)a.childOrder=i;});
      // Deliberately do not change the user's independent global execution order.
    }
    save();render();
    if(modal==='detail'&&d.mode==='children')openModal('detail',{id:list.dataset.parentId});
    showToast(d.mode==='matrix'?'분류를 변경했어요.':'순서를 저장했어요.');
  }
  function dragCancel(){if(!drag)return;const d=drag;drag=null;dragCleanup(d,false);render();}
  document.addEventListener('pointerdown',dragStart);
  document.addEventListener('pointermove',dragMove,{passive:false});
  document.addEventListener('pointerup',dragEnd);
  document.addEventListener('pointercancel',dragCancel);
    document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;
    if(a==='dismiss'){if(e.target===btn)closeModal();return;}
    if(a==='close')closeModal();
    else if(a==='home')go('home');
    else if(a==='calendar')go('calendar');
    else if(a==='all'){allTab='matrix';go('all');}
    else if(a==='open-matrix'){allTab='matrix';go('all');}
    else if(a==='prev-week')setWeek(-1);
    else if(a==='next-week')setWeek(1);
    else if(a==='current-week'){selectedWeek=actualWeek();render();}
    else if(a==='all-tab'){allTab=btn.dataset.tab;inlineStepId=null;render();}
    else if(a==='toggle-step')toggleStep(btn.dataset.id);
    else if(a==='toggle-parent'){
      // A native checkbox switches its visual state before the confirmation
      // dialog is accepted. Keep it synced with task.status until the user
      // explicitly confirms the completion.
      if(btn.matches('input[type="checkbox"]'))e.preventDefault();
      toggleParent(btn.dataset.id);
    }
    else if(a==='toggle-card'){const id=btn.dataset.id;if(openCards.has(id))openCards.delete(id);else openCards.add(id);render();}
    else if(a==='inline-step'){inlineStepId=btn.dataset.id;openCards.add(inlineStepId);render();setTimeout(()=>document.querySelector('.inline-step-form input')?.focus(),0);}
    else if(a==='cancel-inline-step'){inlineStepId=null;render();}
    else if(a==='pick-tasks')openModal('pick-tasks');
    else if(a==='complete')complete();
    else if(a==='undo')undo();
    else if(a==='settings')openModal('settings');
    else if(a==='choose-date'){selectedDate=btn.dataset.date;render();}
    else if(a==='prev-month'||a==='next-month'){const d=fromISO(calendarMonth+'-01');d.setMonth(d.getMonth()+(a==='prev-month'?-1:1));calendarMonth=dISO(d).slice(0,7);selectedDate=calendarMonth+'-01';render();}
    else if(a==='today-calendar'){selectedDate=today();calendarMonth=selectedDate.slice(0,7);render();}
    else if(a==='add-quadrant-task'){
      const quadrant=Number(btn.dataset.quadrant);
      if(weekMode()==='past'||!Number.isInteger(quadrant)||!Q[quadrant])return;
      openModal('task-form',{quadrant,date:selectedWeek>actualWeek()?selectedWeek:today()});
    }
    else if(a==='add-task')openModal('task-form',{date:btn.dataset.date|| (selectedWeek>actualWeek()?selectedWeek:today())});
    else if(a==='detail')openModal('detail',{id:btn.dataset.id});
    else if(a==='edit-task'){const id=btn.dataset.id;openModal('task-form',{id});}
    else if(a==='add-step')openModal('step-form',{taskId:btn.dataset.id});
    else if(a==='edit-step'){const x=state.actions.find(s=>s.id===btn.dataset.id);if(x)openModal('step-form',{actionId:x.id,taskId:x.taskId});}
    else if(a==='delete-step'){const id=btn.dataset.id;openModal('confirm',{title:'실행 단계 삭제',message:'이 실행 단계를 삭제할까요? 완료한 단계의 기록도 함께 삭제됩니다.',button:'삭제하기',do:'delete-step',id});}
    else if(a==='delete-task'){const id=btn.dataset.id;openModal('confirm',{title:'할 일 삭제',message:'상위 할 일과 연결된 모든 작은 행동·완료 기록이 함께 삭제돼요. 계속할까요?',button:'삭제하기',do:'delete-task',id});}
    else if(a==='complete-parent')completeParent(btn.dataset.id);
    else if(a==='reopen-parent')reopenParent(btn.dataset.id);
    else if(a==='ask-reset')openModal('confirm',{title:'데이터 초기화',message:'현재 저장된 모든 할 일과 기록이 삭제되고 빈 상태로 돌아가요. 이 작업은 되돌릴 수 없어요.',button:'초기화',do:'reset'});
    else if(a==='confirm-do'){const c=modalContext;if(c?.do==='delete-task')deleteTask(c.id);else if(c?.do==='delete-step')deleteStep(c.id);else if(c?.do==='complete-parent')completeParent(c.id);else if(c?.do==='reset')reset();}
    else if(a==='export')exportData();
  });
  document.addEventListener('submit',e=>{if(e.target.id==='task-form'){e.preventDefault();taskSubmit(e.target);}else if(e.target.id==='step-form'){e.preventDefault();stepSubmit(e.target);}
    else if(e.target.id==='pick-tasks-form'){e.preventDefault();selectTasks(e.target);}
    else if(e.target.classList.contains('inline-step-form')){e.preventDefault();const id=e.target.dataset.parent,title=e.target.elements.title.value;if(addInlineStep(id,title)){inlineStepId=null;render();showToast('실행 단계를 추가했어요.');}}});
  document.addEventListener('keydown',e=>{
    if(!modal)return;
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key!=='Tab')return;
    const dialog=modalRoot.querySelector('[role="dialog"]');if(!dialog)return;
    const focusable=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href]')].filter(el=>el.getClientRects().length&&getComputedStyle(el).visibility!=='hidden');
    if(!focusable.length)return;
    const first=focusable[0],last=focusable[focusable.length-1],focused=document.activeElement;
    if(!dialog.contains(focused)){e.preventDefault();first.focus();}
    else if(e.shiftKey&&focused===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&focused===last){e.preventDefault();first.focus();}
  });
  window.addEventListener('storage',e=>{if(e.key===STORE_V6){const fresh=load();if(fresh){state=fresh;render();}}});
  function refreshForNewWeek(){
    if(actualWeek()!==state.lastActiveWeek){ensureWeek();render();}
  }
  window.addEventListener('focus',refreshForNewWeek);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshForNewWeek();});
  setInterval(refreshForNewWeek,60000);
  render();
})();

</script>
</body>
